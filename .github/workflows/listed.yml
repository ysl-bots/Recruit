name: weekly-listed

# KRX KIND 상장사 목록 갱신 (대기업 판정 ③). 실패하면 기존 파일 유지
on:
  schedule:
    - cron: "41 21 * * 6" # 일요일 06:41 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recruit-state
  cancel-in-progress: false

jobs:
  listed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m recruit listed
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listed.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): listed $(TZ=Asia/Seoul date +%F)"
          git push
