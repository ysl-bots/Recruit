name: weekly-publish

# 주간 Issue를 Recruit-Subscribe-IT에 발행한다. 같은 주에 이미 발행 기록(data/state.json meta.published)이 있으면 건너뛴다.
on:
  schedule:
    - cron: "17 23 * * 0" # 월요일 08:17 KST (UTC 일요일 23:17)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Issue를 만들지 않고 마크다운을 Summary에 출력"
        type: boolean
        default: true
      force:
        description: "이번 주 발행 기록이 있어도 다시 발행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recruit-state
  cancel-in-progress: false

env:
  ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
  ISSUE_REPO: ${{ vars.ISSUE_REPO }}
  CODE_REPO: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python -m recruit publish --dry-run --out issue.md && cat issue.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python -m recruit publish ${{ inputs.force && '--force' || '' }}
      - name: Commit data
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): publish $(TZ=Asia/Seoul date +%G-W%V)"
          git push
