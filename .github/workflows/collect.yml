name: daily-collect

# 매일 수집 → 병합 → 분류 → 대기업 부문 추출 → data/ 커밋
on:
  schedule:
    - cron: "23 22 * * *" # 매일 07:23 KST (UTC 22:23, 정각 회피)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "data/를 커밋하지 않고 요약만 출력"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write # 같은 저장소에 alert Issue

concurrency:
  group: recruit-state # publish와 같은 그룹: 상태 파일 동시 수정 방지
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  VLM_MODEL: ${{ vars.VLM_MODEL }}
  VLM_FALLBACK_MODEL: ${{ vars.VLM_FALLBACK_MODEL }}
  CLASSIFIER_FALLBACK_MODEL: ${{ vars.CLASSIFIER_FALLBACK_MODEL }}
  DETAIL_LIMIT: ${{ vars.DETAIL_LIMIT }}
  ALERT_TOKEN: ${{ github.token }}
  ALERT_REPO: ${{ github.repository }}
  CODE_REPO: ${{ github.repository }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" = "true" ]; then
            python -m recruit daily --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python -m recruit daily | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit data
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): collect $(TZ=Asia/Seoul date +%F)"
          git push
